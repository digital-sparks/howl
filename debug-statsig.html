(function() {

  const TEST_PREFIX = "test_";

  // Parse URL params
  const urlParams = new URLSearchParams(window.location.search);
  const statsigParam = urlParams.get('statsig');

  if (statsigParam) {
    if (statsigParam === 'clear') {
      // Clear test ID and remove param from URL
      localStorage.removeItem(STORAGE_KEY);
      document.cookie = "statsiguuid=; Max-Age=0; Domain=." +
        window.location.host.split('.').slice(-2).join('.') + "; Path=/";

      urlParams.delete('statsig');

      window.history.replaceState({}, '', newUrl);

    } else {
      // Set test stable ID
      const testId = `test_${statsigParam.replace(/-/g, '_')}`;
      localStorage.setItem(STORAGE_KEY, testId);

      // Set cookie with test ID
      const expires = new Date();
      expires.setMonth(expires.getMonth() + 12);
      const domain = "." + window.location.host.split('.').slice(-2).join('.');
      document.cookie = `statsiguuid=${testId};Expires=${expires};Domain=${domain};Path=/;Secure`;
    }
  }

  // If current ID is a test ID, ensure statsig param stays in URL
  const currentId = localStorage.getItem(STORAGE_KEY);
  if (currentId && currentId.startsWith(TEST_PREFIX) && !statsigParam) {
    // Extract the test variant from the ID (e.g., "test-gate-pass" -> "gate-pass")
    const variant = currentId.substring(TEST_PREFIX.length);
    urlParams.set('statsig', variant);
    const newUrl = window.location.pathname + '?' + urlParams.toString();
    window.history.replaceState({}, '', newUrl);
  }
})();

// --- Timebox helper: resolves to { ok: true } or { ok: false, timeout: true }
async function withTimeout(promise, ms) {
  return Promise.race([
    promise.then(() => ({ ok: true })),
    new Promise((resolve) =>
      setTimeout(() => resolve({ ok: false, timeout: true }), ms)
    ),
  ]);
}

// --- Retry logic for Statsig initialization
async function waitForStatsig(timeout = 2000, retries = 100, delay = 100) {
  for (let attempt = 1; attempt <= retries; attempt++) {
    const { StatsigClient } = window.Statsig || {};

    if (StatsigClient && !window.statsigClient) {
      const userObj = {};
      if (localStorage.getItem("STATSIG_LOCAL_STORAGE_STABLE_ID")) {
        userObj.customIDs = {
          stableID: localStorage.getItem("STATSIG_LOCAL_STORAGE_STABLE_ID"),
        };
      }

      const client = new StatsigClient(
        "client-eNg4fu7Fpe036cvkjwJk5AheQdNZUgFIWeSme9TRQMw",
        userObj,
        { environment: { tier: "production" } }
      );

      window.statsigClient = client;
    }

    if (
      window.statsigClient &&
      typeof window.statsigClient.initializeAsync === "function"
    ) {
      const result = await withTimeout(
        window.statsigClient.initializeAsync(),
        timeout
      );
      if (result.ok) {
        return { ok: true };
      }
    }

    if (attempt < retries) {
      console.warn(
        `Statsig not ready (attempt ${attempt}/${retries}). Retrying in ${delay}ms...`
      );
      await new Promise((r) => setTimeout(r, delay));
    }
  }

  return { ok: false, timeout: true };
}

<script>
	const adsUrlParams = new URLSearchParams(window.location.search);
	const isAds = adsUrlParams.get("ads");

  const sessionId = adsUrlParams.get("sessionId");
  const referralToken = adsUrlParams.get("referralToken");
  const withingsToken =
    adsUrlParams.get("withings_token") ?? adsUrlParams.get("withingsToken");
  const has_withings_plus = adsUrlParams.get("has_withings_plus");
  const FayBookingCode = adsUrlParams.get("FayBookingCode");

  if (withingsToken) {
    localStorage.setItem("withingsToken", withingsToken);
  }

  // Timebox helper: resolves to { ok: true } or { ok: false, timeout: true }
  async function withTimeout(promise, ms) {
    return Promise.race([
      promise.then(() => ({ ok: true })),
      new Promise((resolve) =>
        setTimeout(() => resolve({ ok: false, timeout: true }), ms)
      ),
    ]);
  }

  async function waitForMixpanel(timeout = 2000, retries = 100, delay = 100) {
    for (let attempt = 1; attempt <= retries; attempt++) {
      if (window.mixpanel) {
        const result = await withTimeout(
          Promise.resolve(window.mixpanel),
          timeout
        );
        if (result.ok) {
          return { ok: true };
        }
      }

      if (attempt < retries) {
        console.warn(
          `Mixpanel not ready (attempt ${attempt}/${retries}). Retrying in ${delay}ms...`
        );

        // wait before retrying
        await new Promise((r) => setTimeout(r, delay));
      }
    }
    return { ok: false, timeout: true };
  }

  // Global promise that retries
  window.mixpanelReady = (async () => {
    const result = await waitForMixpanel();
    console.log('[DEBUG] Mixpanel ready result:', result);
    return result;
  })();

  // Helper function to ensure tracking completes before redirect
  async function trackAndRedirect(eventName, properties, redirectUrl) {
    console.log('[DEBUG] trackAndRedirect called');
    console.log('[DEBUG] Event:', eventName);
    console.log('[DEBUG] Properties:', properties);
    console.log('[DEBUG] Redirect URL:', redirectUrl);
    console.log('[DEBUG] window.mixpanel exists:', !!window.mixpanel);

    return new Promise((resolve) => {
      if (window.mixpanel && typeof window.mixpanel.track === 'function') {
        console.log('[DEBUG] Calling mixpanel.track with callback');

        let callbackFired = false;

        // Use mixpanel's callback to ensure event is sent
        window.mixpanel.track(eventName, properties, () => {
          console.log('[DEBUG] Mixpanel callback fired for:', eventName);
          callbackFired = true;
          resolve();
        });

        // Fallback: redirect after 1000ms even if callback doesn't fire
        setTimeout(() => {
          if (!callbackFired) {
            console.warn('[DEBUG] Mixpanel callback did not fire, proceeding anyway');
          }
          resolve();
        }, 1000);
      } else {
        console.log('[DEBUG] No mixpanel available, resolving immediately');
        // No mixpanel, redirect immediately
        resolve();
      }
    }).then(() => {
      console.log('[DEBUG] About to redirect to:', redirectUrl);
      window.location.href = redirectUrl;
    });
  }

  function appendAdsParamOnLinks() {
    const currentDomain = new URL(window.location.href);
    document.querySelectorAll("a[href]").forEach((link) => {
      try {
        const href = link.getAttribute("href");
        if (href.startsWith("/")) {
          updatedUrl = new URL(href, window.location.origin);
        } else if (href.startsWith("http")) {
          const tempUrl = new URL(href);
          if (
            !tempUrl.hostname.endsWith(".faynutrition.com") &&
            tempUrl.hostname !== "faynutrition.com"
          ) {
            return;
          }
          updatedUrl = tempUrl;
        } else {
          return;
        }

        const searchParams = new URLSearchParams(updatedUrl.search);
        if (isAds == true || isAds == "true") {
          searchParams.set("ads", "true");
        }

        if (customerId && sessionId) {
          searchParams.set("customerId", customerId);
          searchParams.set("sessionId", sessionId);
        }

        if (referralToken) {
          searchParams.set("referralToken", referralToken);
        }

        if (withingsToken) {
          searchParams.set("withingsToken", withingsToken);
        }

        if (has_withings_plus) {
          searchParams.set("has_withings_plus", has_withings_plus);
        }

        if (FayBookingCode) {
          searchParams.set("FayBookingCode", FayBookingCode);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const insurance = urlParams.get("insurance");

        if (insurance != null && insurance != "") {
          searchParams.set("insurance", insurance);
        }

        updatedUrl.search = searchParams.toString();
        link.href = updatedUrl.toString();
      } catch (err) {
        console.warn("Invalid link:", link.href);
      }
    });
  }

  window.Webflow ||= [];
  window.Webflow.push(() => {
    appendAdsParamOnLinks();
